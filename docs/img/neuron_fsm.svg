<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" font-family='DejaVu Sans,Arial,sans-serif'>
<rect width="1120" height="360" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45606B"/></marker></defs>
<text x="24" y="34" font-size="26" font-weight="bold" fill="#0F2A33">snn_core.v controller: 4 states per frame</text>
<circle cx="120" cy="150" r="62" fill="#D6E8F5" stroke="#0F2A33" stroke-width="2.5"/>
<text x='120' y='142' font-size='20' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >IDLE</text>
<text x='120' y='162' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >wait for a</text>
<text x='120' y='177' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >spike vector</text>
<path d="M182,150 L338,150" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="400" cy="150" r="62" fill="#D6E8F5" stroke="#0F2A33" stroke-width="2.5"/>
<text x='400' y='142' font-size='20' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >ACC</text>
<text x='400' y='162' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >1 clock per</text>
<text x='400' y='177' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >'yes' input</text>
<path d="M462,150 L618,150" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="680" cy="150" r="62" fill="#F2A541" stroke="#0F2A33" stroke-width="2.5"/>
<text x='680' y='142' font-size='20' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >LIF</text>
<text x='680' y='162' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >8 time steps</text>
<text x='680' y='177' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >(leak, add, fire)</text>
<path d="M742,150 L898,150" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="960" cy="150" r="62" fill="#1B998B" stroke="#0F2A33" stroke-width="2.5"/>
<text x='960' y='142' font-size='20' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >OUT</text>
<text x='960' y='162' font-size='12' fill='#E8F3F0' text-anchor='middle' dominant-baseline='middle' >compare counts,</text>
<text x='960' y='177' font-size='12' fill='#E8F3F0' text-anchor='middle' dominant-baseline='middle' >report verdict</text>
<path d="M650,90 a40,34 0 1,1 60,0" fill="none" stroke="#F2A541" stroke-width="2.2" marker-end="url(#a)"/>
<text x='680' y='30' font-size='16' fill='#B5761A' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >x8</text>
<path d="M960,212 L960,300 L120,300 L120,212" fill="none" stroke="#5F6F78" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x='560' y='318' font-size='13' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >next frame</text>
