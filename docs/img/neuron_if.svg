<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" font-family='DejaVu Sans,Arial,sans-serif'>
<rect width="1120" height="330" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45606B"/></marker></defs>
<text x="24" y="34" font-size="26" font-weight="bold" fill="#0F2A33">IF neuron (integrate-and-fire): the simplest</text>
<circle cx="30" cy="175" r="4" fill="#0F2A33"/>
<text x='44' y='175' font-size='14' fill='#0F2A33' text-anchor='start' dominant-baseline='middle' font-family='DejaVu Sans Mono,monospace'>inputs I</text>
<rect x="130" y="145" width="120" height="60" rx="7" fill="#D6E8F5" stroke="#0F2A33" stroke-width="2"/>
<path d="M132,197 l10,-8 l0,16 z" fill="#0F2A33"/>
<text x='190' y='168' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >v</text>
<text x='190' y='186' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >charge</text>
<path d="M60,175 L130,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="334" cy="175" r="22" fill="#FCE6C8" stroke="#0F2A33" stroke-width="2"/>
<text x='334' y='175' font-size='18' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >+</text>
<path d="M250,175 L310,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="418" y="147" width="120" height="56" rx="4" fill="#FBD9DE" stroke="#0F2A33" stroke-width="2"/>
<text x='478' y='175' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >≥ th</text>
<path d="M358,175 L418,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="1090" cy="175" r="4" fill="#0F2A33"/>
<text x='1076' y='175' font-size='14' fill='#0F2A33' text-anchor='end' dominant-baseline='middle' font-family='DejaVu Sans Mono,monospace'>spike</text>
<path d="M538,175 L1090,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<text x='30' y='290' font-size='13' fill='#5F6F78' text-anchor='start' dominant-baseline='middle' >No leak: the charge only ever goes up until it fires. 1 register + 1 adder + 1 comparator.</text>
<text x='30' y='308' font-size='13' fill='#5F6F78' text-anchor='start' dominant-baseline='middle' >Cheapest to build, but it never forgets, so noise can slowly push it over the line.</text>
</svg>