<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">SNN packet firewall: simplified architecture</text>

  <!-- left: network -->
  <rect x="20" y="210" width="130" height="80" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="85" y="245" text-anchor="middle" font-size="17" fill="#263238">Network</text>
  <text x="85" y="268" text-anchor="middle" font-size="14" fill="#546e7a">cable / WiFi</text>
  <line x1="150" y1="250" x2="198" y2="250" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>

  <rect x="200" y="210" width="120" height="80" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="260" y="245" text-anchor="middle" font-size="17" fill="#263238">MAC</text>
  <text x="260" y="268" text-anchor="middle" font-size="13" fill="#546e7a">bytes in, 1/clock</text>
  <line x1="320" y1="250" x2="350" y2="250" stroke="#37474f" stroke-width="3"/>
  <line x1="350" y1="160" x2="350" y2="280" stroke="#37474f" stroke-width="3"/>
  <line x1="350" y1="160" x2="393" y2="160" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>
  <line x1="350" y1="280" x2="393" y2="280" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>

  <!-- firewall chip -->
  <rect x="370" y="70" width="560" height="430" rx="16" fill="#f3f8ff" stroke="#1565c0" stroke-width="3"/>
  <text x="650" y="100" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d47a1">The firewall block (our design)</text>

  <!-- buffer -->
  <rect x="395" y="125" width="510" height="70" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="650" y="155" text-anchor="middle" font-size="17" fill="#0d47a1">1. Packet buffer (waiting room, 2 KiB)</text>
  <text x="650" y="180" text-anchor="middle" font-size="13" fill="#1565c0">every frame is stored here while it is being judged</text>

  <!-- brain -->
  <rect x="395" y="225" width="160" height="110" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="475" y="255" text-anchor="middle" font-size="16" fill="#e65100">2. Read the</text>
  <text x="475" y="277" text-anchor="middle" font-size="16" fill="#e65100">header</text>
  <text x="475" y="303" text-anchor="middle" font-size="12" fill="#bf360c">IP, ports, flags, TTL…</text>
  <text x="475" y="320" text-anchor="middle" font-size="12" fill="#bf360c">(pkt_parser)</text>

  <line x1="555" y1="280" x2="583" y2="280" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="585" y="225" width="150" height="110" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="660" y="255" text-anchor="middle" font-size="16" fill="#e65100">3. 64 yes/no</text>
  <text x="660" y="277" text-anchor="middle" font-size="16" fill="#e65100">questions</text>
  <text x="660" y="303" text-anchor="middle" font-size="12" fill="#bf360c">"is it TCP? SYN set?</text>
  <text x="660" y="320" text-anchor="middle" font-size="12" fill="#bf360c">many SYNs lately?"</text>

  <line x1="735" y1="280" x2="763" y2="280" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="765" y="225" width="140" height="110" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="835" y="255" text-anchor="middle" font-size="16" fill="#6a1b9a">4. Spiking</text>
  <text x="835" y="277" text-anchor="middle" font-size="16" fill="#6a1b9a">neural net</text>
  <text x="835" y="303" text-anchor="middle" font-size="12" fill="#4a148c">64 → 16 → 2 neurons</text>
  <text x="835" y="320" text-anchor="middle" font-size="12" fill="#4a148c">8 time steps</text>

  <!-- verdict -->
  <line x1="835" y1="335" x2="835" y2="368" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="610" y="370" width="295" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="757" y="400" text-anchor="middle" font-size="16" fill="#1b5e20">5. Verdict: benign or malicious</text>
  <text x="757" y="425" text-anchor="middle" font-size="13" fill="#2e7d32">benign → release the stored frame</text>
  <text x="757" y="447" text-anchor="middle" font-size="13" fill="#c62828">malicious → erase it from the buffer</text>

  <!-- buffer to output, gated by the verdict -->
  <line x1="905" y1="160" x2="1085" y2="160" stroke="#37474f" stroke-width="3"/>
  <line x1="1085" y1="160" x2="1085" y2="226" stroke="#37474f" stroke-width="3" marker-end="url(#a)"/>
  <circle cx="945" cy="160" r="9" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/>
  <line x1="905" y1="420" x2="945" y2="420" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="945" y1="420" x2="945" y2="171" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="953" y="200" font-size="12" fill="#2e7d32">gate:</text>
  <text x="953" y="215" font-size="12" fill="#2e7d32">release</text>
  <text x="953" y="230" font-size="12" fill="#2e7d32">or erase</text>

  <!-- host -->
  <rect x="995" y="230" width="185" height="80" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="1087" y="262" text-anchor="middle" font-size="17" fill="#263238">Computer / OS</text>
  <text x="1087" y="285" text-anchor="middle" font-size="12" fill="#546e7a">only sees benign frames</text>

  <!-- config -->
  <rect x="395" y="400" width="190" height="70" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <text x="490" y="428" text-anchor="middle" font-size="14" fill="#424242">Weights loaded at run</text>
  <text x="490" y="450" text-anchor="middle" font-size="14" fill="#424242">time (retrain anytime)</text>
  <line x1="585" y1="420" x2="763" y2="330" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>

  <text x="600" y="530" text-anchor="middle" font-size="14" fill="#455a64">Same block on 3 targets: ASIC (inside the NIC) · Tang Nano 9K (PC sends frames over UART) · Chameleon96 (Linux asks the FPGA)</text>
</svg>
