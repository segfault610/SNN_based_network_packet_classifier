<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" font-family='DejaVu Sans,Arial,sans-serif'>
<rect width="1120" height="360" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45606B"/></marker></defs>
<text x="24" y="34" font-size="26" font-weight="bold" fill="#0F2A33">Izhikevich neuron: biologically rich, but needs a multiplier</text>
<circle cx="30" cy="180" r="4" fill="#0F2A33"/>
<text x='44' y='180' font-size='14' fill='#0F2A33' text-anchor='start' dominant-baseline='middle' font-family='DejaVu Sans Mono,monospace'>inputs I</text>
<rect x="150" y="150" width="110" height="60" rx="7" fill="#D6E8F5" stroke="#0F2A33" stroke-width="2"/>
<path d="M152,202 l10,-8 l0,16 z" fill="#0F2A33"/>
<text x='205' y='173' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >v</text>
<text x='205' y='191' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >membrane</text>
<rect x="330" y="120" width="120" height="56" rx="4" fill="#D1495B" stroke="#0F2A33" stroke-width="2"/>
<text x='390' y='141' font-size='15' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >v x v</text>
<text x='390' y='159' font-size='11' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >MULTIPLIER</text>
<text x='390' y='100' font-size='13' fill='#D1495B' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >the expensive part</text>
<rect x="330" y="220" width="120" height="56" rx="4" fill="#FCE6C8" stroke="#0F2A33" stroke-width="2"/>
<text x='390' y='241' font-size='15' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >0.04v²+5v+140</text>
<text x='390' y='259' font-size='11' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >poly</text>
<circle cx="560" cy="180" r="22" fill="#FCE6C8" stroke="#0F2A33" stroke-width="2"/>
<text x='560' y='180' font-size='18' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >+</text>
