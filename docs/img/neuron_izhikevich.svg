<path d="M682,122 l10,-8 l0,16 z" fill="#0F2A33"/>
<text x='735' y='93' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >u</text>
<text x='735' y='111' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >recovery</text>
<circle cx="560" cy="90" r="22" fill="#FCE6C8" stroke="#0F2A33" stroke-width="2"/>
<text x='560' y='90' font-size='18' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >−</text>
