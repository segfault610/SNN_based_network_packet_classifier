<rect x="620" y="300" width="470" height="40" rx="8" fill="#D1495B"/>
<text x='855' y='320' font-size='15' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >2 registers + a multiplier: several x the area of LIF</text>
