<text x='760' y='180' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >≥ 30 mV</text>
<rect x="900" y="150" width="110" height="60" rx="7" fill="#F2A541" stroke="#0F2A33" stroke-width="2"/>
<path d="M902,202 l10,-8 l0,16 z" fill="#0F2A33"/>
<text x='955' y='173' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >spike</text>
<text x='955' y='191' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >+ reset v,u</text>
