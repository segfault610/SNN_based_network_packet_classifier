<path d="M260,180 L300,180 L300,148 L330,148" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M260,180 L300,180 L300,248 L330,248" fill="none" stroke="#45606B" stroke-width="2.2"/>
