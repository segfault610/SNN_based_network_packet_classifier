<path d="M132,197 l10,-8 l0,16 z" fill="#0F2A33"/>
<text x='190' y='168' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >v</text>
<text x='190' y='186' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >charge</text>
<path d="M60,175 L130,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="310" y="147" width="90" height="56" rx="4" fill="#EAF2F3" stroke="#0F2A33" stroke-width="2"/>
<text x='355' y='175' font-size='15' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >leak</text>
<path d="M250,175 L310,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="484" cy="175" r="22" fill="#FCE6C8" stroke="#0F2A33" stroke-width="2"/>
<text x='484' y='175' font-size='18' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >+</text>
<path d="M400,175 L460,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="568" y="147" width="120" height="56" rx="4" fill="#FBD9DE" stroke="#0F2A33" stroke-width="2"/>
<text x='628' y='175' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >≥ th</text>
<path d="M508,175 L568,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
