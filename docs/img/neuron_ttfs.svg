<text x='803' y='168' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >timer</text>
<text x='803' y='186' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >latch t</text>
<path d="M688,175 L748,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="1090" cy="175" r="4" fill="#0F2A33"/>
<text x='1078' y='160' font-size='14' fill='#0F2A33' text-anchor='end' dominant-baseline='middle' font-family='DejaVu Sans Mono,monospace'>spike</text>
<path d="M858,175 L1090,175" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="790" y="60" width="300" height="40" rx="8" fill="#1B998B"/>
<text x='940' y='80' font-size='15' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >fires at most ONCE per frame</text>
<text x='30' y='290' font-size='13' fill='#5F6F78' text-anchor='start' dominant-baseline='middle' >LIF plus a small timer and a 'fired' latch: the neuron spikes at most once and the time carries the value.</text>
<text x='30' y='308' font-size='13' fill='#5F6F78' text-anchor='start' dominant-baseline='middle' >Far fewer spike events -> lower switching power, at the cost of a timer per neuron (Zhou &amp; Li 2020).</text>
