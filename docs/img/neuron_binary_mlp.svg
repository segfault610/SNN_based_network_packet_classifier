<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" font-family='DejaVu Sans,Arial,sans-serif'>
<rect width="1120" height="330" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45606B"/></marker></defs>
<text x="24" y="34" font-size="26" font-weight="bold" fill="#0F2A33">Binary MLP neuron (not spiking): XNOR + popcount, one pass</text>
<circle cx="30" cy="170" r="4" fill="#0F2A33"/>
<text x='42' y='155' font-size='14' fill='#0F2A33' text-anchor='start' dominant-baseline='middle' font-family='DejaVu Sans Mono,monospace'>inputs (bits)</text>
<rect x="160" y="130" width="150" height="80" rx="4" fill="#FCE6C8" stroke="#0F2A33" stroke-width="2"/>
<text x='235' y='163' font-size='15' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >XNOR array</text>
<text x='235' y='181' font-size='11' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >input ⊕ weight</text>
<rect x="400" y="130" width="160" height="80" rx="4" fill="#EAF2F3" stroke="#0F2A33" stroke-width="2"/>
<text x='480' y='163' font-size='15' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >popcount</text>
<text x='480' y='181' font-size='11' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >count the 1s</text>
<rect x="640" y="142" width="130" height="56" rx="4" fill="#FBD9DE" stroke="#0F2A33" stroke-width="2"/>
<text x='705' y='170' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >≥ half?</text>
<rect x="840" y="140" width="120" height="60" rx="7" fill="#F2A541" stroke="#0F2A33" stroke-width="2"/>
<path d="M842,192 l10,-8 l0,16 z" fill="#0F2A33"/>
<text x='900' y='163' font-size='16' fill='#0F2A33' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >output</text>
<text x='900' y='181' font-size='12' fill='#5F6F78' text-anchor='middle' dominant-baseline='middle' >1 bit</text>
<path d="M60,170 L160,170" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M310,170 L400,170" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M560,170 L640,170" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M770,170 L840,170" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<circle cx="1090" cy="170" r="4" fill="#0F2A33"/>
<text x='1078' y='155' font-size='14' fill='#0F2A33' text-anchor='end' dominant-baseline='middle' font-family='DejaVu Sans Mono,monospace'>to next layer</text>
<path d="M960,170 L1090,170" fill="none" stroke="#45606B" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="160" y="250" width="800" height="40" rx="8" fill="#1B998B"/>
<text x='560' y='270' font-size='15' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold' >No register, no time steps: one pass, no state. Fast, but no temporal memory.</text>
</svg>